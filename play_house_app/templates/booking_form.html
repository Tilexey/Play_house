{% load static %}
<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Бронювання</title>
    <!-- Підключаємо новий CSS -->
    <link rel="stylesheet" href="{% static 'css/style_from_form.css' %}">
</head>
<body>

<div class="container mt-5">
    <div class="card shadow-lg p-4">
        <h1 class="text-center mb-4">Забронювати місце</h1>

        <form method="post" class="needs-validation">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary w-100">Забронювати</button>
        </form>

        <div class="mt-3 text-center">
           <a href="/">Головна</a>
        </div>
    </div>
</div>

</body>
</html>
